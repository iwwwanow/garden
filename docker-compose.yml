services:
  postgres:
    image: postgres:17.9
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garden}
      POSTGRES_DB: ${POSTGRES_DB:-garden}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-garden}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: golang:1.26.2-bookworm
    working_dir: /app
    command: sh -c "go install github.com/air-verse/air@v1.62.0 && go install github.com/pressly/goose/v3/cmd/goose@v3.27.0 && air"
    volumes:
      - ./server:/app
      - go_cache:/root/.cache/go-build
      - go_mod:/go/pkg/mod
    ports:
      - "8080:8080"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-garden}:${POSTGRES_PASSWORD:-garden}@postgres:5432/${POSTGRES_DB:-garden}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  client:
    image: node:22.16.0-alpine3.22
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"
    volumes:
      - ./client:/app
      - client_nm:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://server:8080
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
  go_cache:
  go_mod:
  client_nm:
