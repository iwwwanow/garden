<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ddeeff"/>
      <stop offset="100%" stop-color="#a8c8f0"/>
    </radialGradient>
    <radialGradient id="p" cx="35%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#90c8ff"/>
      <stop offset="60%" stop-color="#4090e8"/>
      <stop offset="100%" stop-color="#1a5cba"/>
    </radialGradient>
    <radialGradient id="p2" cx="35%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#c0d8ff"/>
      <stop offset="60%" stop-color="#409af4"/>
      <stop offset="100%" stop-color="#0055bb"/>
    </radialGradient>
    <radialGradient id="ctr" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#ffe8c0"/>
      <stop offset="100%" stop-color="#e08020"/>
    </radialGradient>
  </defs>

  <rect width="300" height="400" fill="url(#bg)"/>
  <ellipse cx="150" cy="396" rx="110" ry="16" fill="rgba(40,80,160,0.18)"/>

  <!-- Stem -->
  <path d="M150 298 Q148 352 145 400" stroke="#2266cc" stroke-width="6" fill="none"
        stroke-linecap="round"/>
  <!-- Leaves -->
  <ellipse cx="136" cy="348" rx="24" ry="10" fill="#2266cc" opacity="0.7"
           transform="rotate(-38,136,348)"/>
  <ellipse cx="160" cy="324" rx="20" ry="8" fill="#409af4" opacity="0.65"
           transform="rotate(28,160,324)"/>

  <!-- Back petals -->
  <g transform="translate(150,212)">
    <ellipse rx="22" ry="65" fill="url(#p2)" opacity="0.55" transform="rotate(36) translate(0,-58)"/>
    <ellipse rx="22" ry="65" fill="url(#p2)" opacity="0.55" transform="rotate(108) translate(0,-58)"/>
    <ellipse rx="22" ry="65" fill="url(#p2)" opacity="0.55" transform="rotate(180) translate(0,-58)"/>
    <ellipse rx="22" ry="65" fill="url(#p2)" opacity="0.55" transform="rotate(252) translate(0,-58)"/>
    <ellipse rx="22" ry="65" fill="url(#p2)" opacity="0.55" transform="rotate(324) translate(0,-58)"/>
  </g>

  <!-- Front petals (5) -->
  <g transform="translate(150,212)">
    <ellipse rx="24" ry="68" fill="url(#p)" transform="rotate(0) translate(0,-56)"/>
    <ellipse rx="24" ry="68" fill="url(#p)" transform="rotate(72) translate(0,-56)"/>
    <ellipse rx="24" ry="68" fill="url(#p)" transform="rotate(144) translate(0,-56)"/>
    <ellipse rx="24" ry="68" fill="url(#p)" transform="rotate(216) translate(0,-56)"/>
    <ellipse rx="24" ry="68" fill="url(#p)" transform="rotate(288) translate(0,-56)"/>

    <!-- Center -->
    <circle r="27" fill="url(#ctr)"/>
    <ellipse cx="-7" cy="-9" rx="11" ry="8" fill="rgba(255,255,255,0.5)"/>
  </g>

  <!-- Dew drops -->
  <circle cx="112" cy="170" r="4" fill="rgba(255,255,255,0.75)"/>
  <circle cx="114" cy="168" r="2" fill="white"/>
  <circle cx="185" cy="163" r="3" fill="rgba(255,255,255,0.65)"/>
</svg>
