<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#fff3d0"/>
      <stop offset="100%" stop-color="#e8c890"/>
    </radialGradient>
    <radialGradient id="p" cx="35%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="55%" stop-color="#f9a825"/>
      <stop offset="100%" stop-color="#c67000"/>
    </radialGradient>
    <radialGradient id="p2" cx="35%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#fff3c0"/>
      <stop offset="60%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#e08000"/>
    </radialGradient>
    <radialGradient id="ctr" cx="32%" cy="28%" r="58%">
      <stop offset="0%" stop-color="#a0522d"/>
      <stop offset="100%" stop-color="#5c2a00"/>
    </radialGradient>
  </defs>

  <rect width="300" height="400" fill="url(#bg)"/>
  <ellipse cx="150" cy="396" rx="118" ry="17" fill="rgba(140,80,10,0.18)"/>

  <!-- Stem (slightly bent — dried effect) -->
  <path d="M150 300 Q155 355 158 400" stroke="#7a5c20" stroke-width="6" fill="none"
        stroke-linecap="round"/>
  <!-- Dried leaves (droopy) -->
  <ellipse cx="165" cy="348" rx="28" ry="10" fill="#8d6e30" opacity="0.65"
           transform="rotate(42,165,348)"/>
  <ellipse cx="140" cy="330" rx="22" ry="8" fill="#a0803a" opacity="0.55"
           transform="rotate(-22,140,330)"/>

  <!-- Sunflower-style: ray petals (long, thin) -->
  <g transform="translate(150,205)">
    <!-- Ray petals (12) -->
    <ellipse rx="14" ry="72" fill="url(#p2)" opacity="0.75" transform="rotate(0)   translate(0,-72)"/>
    <ellipse rx="14" ry="72" fill="url(#p2)" opacity="0.75" transform="rotate(30)  translate(0,-72)"/>
    <ellipse rx="14" ry="72" fill="url(#p2)" opacity="0.75" transform="rotate(60)  translate(0,-72)"/>
    <ellipse rx="14" ry="72" fill="url(#p2)" opacity="0.75" transform="rotate(90)  translate(0,-72)"/>
    <ellipse rx="14" ry="72" fill="url(#p2)" opacity="0.75" transform="rotate(120) translate(0,-72)"/>
    <ellipse rx="14" ry="72" fill="url(#p2)" opacity="0.75" transform="rotate(150) translate(0,-72)"/>
    <ellipse rx="14" ry="72" fill="url(#p2)" opacity="0.75" transform="rotate(180) translate(0,-72)"/>
    <ellipse rx="14" ry="72" fill="url(#p2)" opacity="0.75" transform="rotate(210) translate(0,-72)"/>
    <ellipse rx="14" ry="72" fill="url(#p2)" opacity="0.75" transform="rotate(240) translate(0,-72)"/>
    <ellipse rx="14" ry="72" fill="url(#p2)" opacity="0.75" transform="rotate(270) translate(0,-72)"/>
    <ellipse rx="14" ry="72" fill="url(#p2)" opacity="0.75" transform="rotate(300) translate(0,-72)"/>
    <ellipse rx="14" ry="72" fill="url(#p2)" opacity="0.75" transform="rotate(330) translate(0,-72)"/>

    <!-- Inner petals (front, more saturated) -->
    <ellipse rx="13" ry="60" fill="url(#p)" transform="rotate(15)  translate(0,-62)"/>
    <ellipse rx="13" ry="60" fill="url(#p)" transform="rotate(75)  translate(0,-62)"/>
    <ellipse rx="13" ry="60" fill="url(#p)" transform="rotate(135) translate(0,-62)"/>
    <ellipse rx="13" ry="60" fill="url(#p)" transform="rotate(195) translate(0,-62)"/>
    <ellipse rx="13" ry="60" fill="url(#p)" transform="rotate(255) translate(0,-62)"/>
    <ellipse rx="13" ry="60" fill="url(#p)" transform="rotate(315) translate(0,-62)"/>

    <!-- Dark center disc -->
    <circle r="36" fill="url(#ctr)"/>
    <!-- Seed pattern -->
    <circle r="32" fill="none" stroke="rgba(255,200,100,0.2)" stroke-width="2" stroke-dasharray="4 3"/>
    <circle r="22" fill="none" stroke="rgba(255,200,100,0.2)" stroke-width="2" stroke-dasharray="3 2"/>
    <!-- Specular -->
    <ellipse cx="-8" cy="-12" rx="12" ry="8" fill="rgba(255,255,255,0.35)"/>
  </g>
</svg>
