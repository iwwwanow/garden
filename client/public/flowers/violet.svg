<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ede0ff"/>
      <stop offset="100%" stop-color="#c0a0e8"/>
    </radialGradient>
    <radialGradient id="p" cx="35%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#d0a0ff"/>
      <stop offset="55%" stop-color="#9040d0"/>
      <stop offset="100%" stop-color="#5a1890"/>
    </radialGradient>
    <radialGradient id="p2" cx="35%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#e0c0ff"/>
      <stop offset="55%" stop-color="#b060e8"/>
      <stop offset="100%" stop-color="#7030a8"/>
    </radialGradient>
    <radialGradient id="ctr" cx="30%" cy="28%" r="58%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#fdd835"/>
    </radialGradient>
  </defs>

  <rect width="300" height="400" fill="url(#bg)"/>
  <ellipse cx="150" cy="396" rx="112" ry="16" fill="rgba(90,24,160,0.18)"/>

  <!-- Stem -->
  <path d="M150 296 Q146 350 143 400" stroke="#7030a8" stroke-width="6" fill="none"
        stroke-linecap="round"/>
  <!-- Leaves -->
  <ellipse cx="134" cy="346" rx="25" ry="10" fill="#8040b8" opacity="0.7"
           transform="rotate(-36,134,346)"/>
  <ellipse cx="161" cy="322" rx="20" ry="8" fill="#9040c8" opacity="0.6"
           transform="rotate(30,161,322)"/>

  <!-- Back petals -->
  <g transform="translate(150,210)">
    <ellipse rx="27" ry="68" fill="url(#p2)" opacity="0.55" transform="rotate(30)  translate(0,-58)"/>
    <ellipse rx="27" ry="68" fill="url(#p2)" opacity="0.55" transform="rotate(90)  translate(0,-58)"/>
    <ellipse rx="27" ry="68" fill="url(#p2)" opacity="0.55" transform="rotate(150) translate(0,-58)"/>
    <ellipse rx="27" ry="68" fill="url(#p2)" opacity="0.55" transform="rotate(210) translate(0,-58)"/>
    <ellipse rx="27" ry="68" fill="url(#p2)" opacity="0.55" transform="rotate(270) translate(0,-58)"/>
    <ellipse rx="27" ry="68" fill="url(#p2)" opacity="0.55" transform="rotate(330) translate(0,-58)"/>
  </g>

  <!-- Front petals (6) -->
  <g transform="translate(150,210)">
    <ellipse rx="29" ry="70" fill="url(#p)" transform="rotate(0)   translate(0,-56)"/>
    <ellipse rx="29" ry="70" fill="url(#p)" transform="rotate(60)  translate(0,-56)"/>
    <ellipse rx="29" ry="70" fill="url(#p)" transform="rotate(120) translate(0,-56)"/>
    <ellipse rx="29" ry="70" fill="url(#p)" transform="rotate(180) translate(0,-56)"/>
    <ellipse rx="29" ry="70" fill="url(#p)" transform="rotate(240) translate(0,-56)"/>
    <ellipse rx="29" ry="70" fill="url(#p)" transform="rotate(300) translate(0,-56)"/>

    <!-- Center -->
    <circle r="26" fill="url(#ctr)"/>
    <ellipse cx="-6" cy="-9" rx="11" ry="7.5" fill="rgba(255,255,255,0.55)"/>
  </g>

  <!-- Dew drops -->
  <circle cx="110" cy="163" r="4.5" fill="rgba(255,255,255,0.7)"/>
  <circle cx="112" cy="161" r="2" fill="white"/>
  <circle cx="186" cy="155" r="3" fill="rgba(255,255,255,0.6)"/>
</svg>
